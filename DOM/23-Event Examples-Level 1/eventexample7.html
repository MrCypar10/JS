<html>
  <head>
    <title>Cancelling The Default Behaviour</title>
    <script>
      function verify() {
          let ans = confirm("Do you want to visit Amazon?");
          return ans;

      }
    </script>
  </head>

  <body>
    <a href="http://www.helpinghandai.in" onclick="return(verify())">Click Me To Visit Amazon</a>
  </body>
</html>
