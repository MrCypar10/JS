<html>
  <head>
    <title>Event Demo</title>
    <script>
      function changecolor1() {
        let div1=document.querySelector("#div1");
        div1.style.backgroundColor="red";
      }

      function changecolor2() {
        let div2=document.querySelector("#div2");
        div2.style.backgroundColor="yellow";
      }
    </script>
    <style type="text/css">
      #div1 {
        width: 300px;
        height: 200px;
        border: solid 1px black;
      }

      #div2 {
        width: 300px;
        height: 200px;
        border: solid 1px black;
      }
    </style>
  </head>

  <body>
    <div id="div1" onclick="changecolor1()">Click to change color to RED</div>
    <div id="div2" onclick="changecolor2()">
      Click to change color to YELLOW
    </div>
  </body>
</html>
