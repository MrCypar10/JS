    <title>Document</title>
    <script>
        let dob =prompt(`Enter you DOB in(yyyy-mm-dd) `);
        let bdy = new Date(dob);
        let dayNum = bdy.getDay();

        let days = ["Sun","Mon","Tue","Wednes","Thurs","Fri","Sat"];

        document.write(`You were Born on : ${dob} and The Day is ${days[dayNum]}day`);
    </script>
