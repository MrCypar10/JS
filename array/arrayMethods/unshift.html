<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        let fruits = ["guava","apple","grapes","melons"];
        document.write(`size is ${fruits.length}<br>`);
        document.write(`values are : ${fruits}<br>`);

        let size = fruits.unshift("orange");
         document.write(`size is ${size}<br>`);
        document.write(`values are : ${size}<br>`);

        size = fruits.unshift("kiwi","banana","mango");
         document.write(`size is ${size}<br>`);
        document.write(`values are : ${size}<br>`);
       //unshift add elements in last while push add in last
    </script>
</head>
<body>
    
</body>
</html>
