<html>
	<head>
		<title>Assignment</title>
		<script>
			function addPara() {
				//Generate ordered para
				let div = document.querySelector("div");
				let child = div.children;
				let p = document.createElement("p");
				let text = document.createTextNode("I am Para "+(child.length+1));
				p.appendChild(text);
				div.appendChild(p);
			}
		</script>
	</head>

	<body>
		<div id="d1">
			<p id="p1">I am para 1</p>
			<p id="p2">I am para 2.</p>
		</div>
		<input type="button" value="add new para" onclick="addPara();" />
	</body>
</html>
