    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Document</title>
    <script>
        let nums = [];
        document.write(`Size of nums is ${nums.length}<br>`);
        nums[0] = 10;
        nums[1] = 20;
        nums[2] = 30;
        nums[4] = 40;
        document.write(`Size of nums is ${nums.length}<br>`);
        document.write(`Values : ${nums}`);
    
    
    </script>
</head>
