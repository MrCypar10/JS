<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let a =prompt(`Enter the Digit :`);
        if (isNaN(a)) {
            document.write(`you did not input a number`);
        }else{
        a = Number(a);
        document.write(`<h3> Table of ${a} </br>`);
            let i = 1;
            document.write("<Table border = '2'>")
            while (i<=10) {
                document.write(`<tr><td>${a} * ${i} = ${a*i}</tr></td>`);
                i++;
            }
        }
    </script>
</head>

</html>
