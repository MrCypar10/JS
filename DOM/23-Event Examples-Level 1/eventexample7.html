<html>
  <head>
    <title>Cancelling The Default Behaviour</title>
    <script>
      function verify() {
        let ans=confirm("Do you want to visit amazon?");
        return ans;

      }
    </script>
  </head>

  <body>
    <a href="http://www.amazon.in" onclick="return(verify())">Click Me To Visit Amazon</a>
  </body>
</html>
