<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>

        //using Slice() with negative indexing.


        let fruits = ["guava", "apple", "banana","kiwi"];
        document.write(`Size : ${fruits.length}<br>`);
        document.write(`Values : ${fruits}<br> <br>`);
        
        let fruits2 = fruits.slice(-3);
        document.write(`Size : ${fruits2.length}<br>`);
        document.write(`Values : ${fruits2}<br>`);

    </script>
</head>
<body>
    
</body>
</html>
