<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function showDateTime(){
            let now = new Date();
            console.log(`${now}`);
        }

        function setTimer(){
            setInterval(showDateTime,1000);// (function_name,time_in_milisec);
        }


        // the Console doesnt stop on its own and run continously unit the tab gets closed.
    </script>
</head>
<body>
    <input type="button" value="Start" onclick="setTimer()"/>
</body>
</html>
