<html>
	<head>
		<title>Understanding style</title>
		<script>
			function showDate() {
				//Write code to insert current system date in the <p> tag
				let date = new Date();
				let today = date.getDate()+"/"+(date.getMonth()+1)+"/"+date.getFullYear(); 
				let time = document.querySelector("p");
				time.innerText = today ;
				time.style.color ="crimson";
				time.style.fontWeight="bold";
			}
		</script>
	</head>

	<body>
		<p>Click the button to display current date</p>
		<input type="button" value="show date" onclick="showDate();" />
	</body>
</html>
