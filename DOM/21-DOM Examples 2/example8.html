<html>
	<head>
		<title>Assignment</title>
		<script>
			function showLink() {
				//code to add the link dynamically
				let getLink = prompt("Enter Website");
				let a = document.querySelector("a");
				a.setAttribute("href",getLink);
				let indexOf = getLink.indexOf(".");
				let domainName = getLink.substring(indexOf+1);
				a.innerText = "Visit "+domainName;
			}
		</script>
	</head>

	<body>
		<h3>Generate Website Link</h3>
		<input type="button" value="Create Website Link" onclick="showLink()" />
		<br />
		<a></a>
	</body>
</html>
