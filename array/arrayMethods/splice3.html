<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        // delets at ending removing and giving output from last.
        let fruits = ["guava","apple","grapes","melons"];
        document.write(`size is ${fruits.length}<br>`);
        document.write(`values are : ${fruits}<br>`);

        fruits.splice(2,1,"orange");
         document.write(`size is ${fruits.length}<br>`);
        document.write(`values are : ${fruits}<br>`);


        
        fruits.splice(1,0,"orange");
         document.write(`size is ${fruits.length}<br>`);
        document.write(`values are : ${fruits}<br>`);

        
        fruits.splice(0,3,"orange");
         document.write(`size is ${fruits.length}<br>`);
        document.write(`values are : ${fruits}<br>`);



    </script>
</head>
