<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let idp1 = new Date("1947-8-15");// ISO (International Standard Org.) Format
        document.write(`Independence Date : ${idp1} <br>`);

        let idp2 = new Date("08/15/1947");// Short Date Format
        document.write(`Independence Date : ${idp2}<br>`);

        let idp3 = new Date("Aug 15, 1947");// Long Date Format
        document.write(`Independence Date : ${idp3}`);
    </script>
</head>
<body>
    
</body>
</html>
