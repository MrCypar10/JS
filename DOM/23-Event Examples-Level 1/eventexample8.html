<html>
  <head>
    <title>Assignment</title>
    <script>
      function check(anchor) {
        
        let input = prompt("Enter the Site name"); 
        if(input === "google"){
          anchor.setAttribute("href","http://www.google.com");
          return true;
        }else if (input === "helpinghandai"){
          anchor.setAttribute("href","http://www.helpinghandai.in");
          return true;
              }else{
              return false;
            }
          }
    </script>
  </head>

  <body>
    <a href="#" onclick="return(check(this))">Click me</a>
  </body>
</html>
