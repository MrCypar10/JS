    <style>
        .light{
            background-color: aliceblue;

        .dark{
            background-color: rgb(198, 15, 15);
        }
    </style>
    <script>
        let a =prompt(`Enter the Digit :`);
        if (isNaN(a)) {
            document.write(`you did not input a number`);
        }else{
        a = Number(a);
        document.write(`<h3> Table of ${a} </br>`);
            let i = 1;
            document.write("<Table border = '2'>")
            let str;
                while (i<=10) {
                    str =  i%2===0 ?"dark":"light";
                document.write(`<tr class="${str}"><td>${a} * ${i} = ${a*i}</tr></td>`);
                i++;
            }
        }
    </script>
