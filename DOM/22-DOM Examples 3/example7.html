<html>
	<head>
		<title>Using insertBefore()</title>
		<script>
			function addPara() {
				//Add new para at top
				let div = document.querySelector("div");
				let p = document.createElement("p");
				let text = document.createTextNode("I am Para 3");
				p.appendChild(text);
				div.insertBefore(p,div.firstElementChild)
				
			}
		</script>
	</head>

	<body>
		<div id="d1">
			<p id="p1">This is first paragraph.</p>
			<p id="p2">This is second paragraph.</p>
		</div>
		<input type="button" value="add new para" onclick="addPara();" />
	</body>
</html>
