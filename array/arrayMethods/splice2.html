<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        // 2 arguments --- removing elements ----- for (1st) from index number , (2nd) for number of values.
        let fruits = ["guava","apple","grapes","melons"];
        document.write(`size is ${fruits.length}<br>`);
        document.write(`values are : ${fruits}<br>`);

        let remo = fruits.pop();
         document.write(`size is ${fruits.length}<br>`);
        document.write(`values are : ${fruits}<br>`);
        document.write(`Deleted element : ${remo}`)

    </script>
