<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Time Zone Selector</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<div class="card">
			<h1>Time Zone Selector</h1>
			<p>Select your timezone from the dropdown and click Show Time</p>

			<div class="controls">
				<select id="timezone"></select>
				<button onclick="showData()">Show Time</button>
			</div>

			<div id="currentdatetime" class="output"></div>
		</div>
	</body>
</html>
