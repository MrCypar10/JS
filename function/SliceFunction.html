<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        //USing slice() for Extracting A SubArray.

        let fruits = ["guava","apple", "orange","mango"];
        document.write(`Size : ${fruits.length}<br>`);
        document.write(`Values : ${fruits}<br>`);
        
        
        let fruits2 = fruits.slice(1,3);
        document.write(`After slicing Original Array Values :${fruits}<br>`);
        document.write(`After slicing Original Array length: ${fruits.length} <br>`);

        document.write(`Sliced Array length ${fruits2.length}<br>`);
        document.write(`Sliced Array Values : ${fruits2}<br>`);

    </script>
</head>
<body>
    
</body>
</html>
