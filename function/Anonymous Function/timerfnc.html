<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let id;
        function showDateTime(){
            let now = new Date();
            console.log(`${now}`);

        }
        function setTimer(){
            console.log("Timer Started");
            id = setInterval(showDateTime,1000);
        }
        function stopTimer(){
            clearInterval(id);
            console.log("Timer Stopped");
        }
    </script>
</head>
<body>
    <input type="button" value=" Start Timer" onclick="setTimer()" />
    <input type="button" value=" Stop Timer" onclick="stopTimer()" />
</body>
</html>
